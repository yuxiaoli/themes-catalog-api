name: Popularity metadata validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reproducible metadata and unchanged category records
        run: |
          python3 tools/update-popularity.py --check
          python3 -m unittest discover -s tests -v
